<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flatto Run Story</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yellowtail&family=Anton&family=Archivo+Black&family=Inter:wght@500;600;800&display=swap">
<style>
/* Layout: one narrow column — run, style, photo, live 9:16 story, share. Single dark look, like a night-run screen. */
:root{
  --bg:#141012; --panel:#1F1A1C; --line:#3A3134; --fg:#F4EEDC; --muted:#A8998F; --sky:#CFE3F3;
  --display:Anton, Impact, "Arial Narrow", sans-serif;
  --script:Yellowtail, "Brush Script MT", cursive;
  --body:Inter, -apple-system, system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--fg);font-family:var(--body);margin:0;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{text-align:center}
.logo{font-family:var(--script);font-size:54px;line-height:1;margin:0}
.kick{font-size:11px;letter-spacing:4px;color:var(--muted);font-weight:600;margin-top:6px}
h2{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.5px;margin:0 0 12px;display:flex;gap:10px;align-items:baseline}
h2 small{font-family:var(--body);font-size:11px;letter-spacing:2px;color:var(--muted);font-weight:800}
section{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
label{display:flex;flex-direction:column;gap:6px;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:600;min-width:0}
input[type=text],input[type=number]{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px 10px;font:600 17px var(--body);width:100%;font-variant-numeric:tabular-nums}
input:focus-visible,button:focus-visible,.chip:focus-within,.pick:focus-within{outline:2px solid var(--sky);outline-offset:2px}
.hint{font-size:12px;color:var(--muted);margin:10px 0 0;line-height:1.5}
.hint label{display:inline;text-transform:none;letter-spacing:0;font-size:12px;color:var(--sky);font-weight:600;cursor:pointer;text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer}
.chip span{display:inline-block;padding:9px 13px;border-radius:999px;border:1px solid var(--line);font-weight:800;font-size:13px}
.chip input:checked+span{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sw{width:18px;height:18px;border-radius:50%;display:inline-block;vertical-align:-4px;margin-right:6px;border:1px solid var(--line)}
.pick{display:block;text-align:center;font:800 15px var(--body);letter-spacing:0;text-transform:none;color:var(--fg);border:1.5px dashed var(--muted);border-radius:14px;padding:15px;cursor:pointer}
canvas{display:block;width:100%;max-width:300px;aspect-ratio:9/16;margin:0 auto;border-radius:16px;background:#2a2a2a}
button{font:800 16px var(--body);border-radius:14px;padding:16px;border:0;background:var(--fg);color:var(--bg);cursor:pointer;width:100%}
.status{font-size:13px;min-height:18px;margin:10px 0 0;color:var(--sky);text-align:center}
.out[hidden]{display:none}
.out{display:block;max-width:220px;margin:12px auto 0;border-radius:12px}
@media (prefers-reduced-motion:no-preference){button{transition:transform .1s}button:active{transform:scale(.98)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="logo">Flatto</p>
    <div class="kick">SESEH RUN CLUB · RUN STORY</div>
  </header>

  <section>
    <h2>Your run <small>1/3</small></h2>
    <div class="grid">
      <label for="dist">km<input id="dist" type="text" inputmode="decimal" value="8.42"></label>
      <label for="time">Time<input id="time" type="text" inputmode="numeric" value="43:41"></label>
      <label for="num">Run #<input id="num" type="number" min="1" value="7"></label>
    </div>
    <p class="hint" id="gpxinfo">Have a GPX from Garmin, Strava or your watch? <label for="gpx">Add it for your route</label><input id="gpx" type="file" accept=".gpx,application/gpx+xml,application/xml,text/xml" hidden></p>
  </section>

  <section>
    <h2>Style <small>2/3</small></h2>
    <div class="chips">
      <label class="chip"><input type="radio" name="style" value="big" checked><span>Big number</span></label>
      <label class="chip"><input type="radio" name="style" value="classic"><span>Classic</span></label>
      <label class="chip"><input type="radio" name="style" value="bib"><span>Race bib</span></label>
      <label class="chip"><input type="radio" name="style" value="route"><span>Route</span></label>
    </div>
    <div class="chips" style="margin-top:10px">
      <label class="chip"><input type="radio" name="color" value="#FFFFFF" checked><span><i class="sw" style="background:#fff"></i>White</span></label>
      <label class="chip"><input type="radio" name="color" value="#CFE3F3"><span><i class="sw" style="background:#CFE3F3"></i>Sky</span></label>
      <label class="chip"><input type="radio" name="color" value="#4C2F31"><span><i class="sw" style="background:#4C2F31"></i>Plum</span></label>
    </div>
  </section>

  <section>
    <h2>Photo <small>3/3</small></h2>
    <label class="pick" for="photo">Choose or take a photo<input id="photo" type="file" accept="image/*" hidden></label>
    <p class="hint" id="photoinfo">Showing an example photo from Seseh.</p>
  </section>

  <canvas id="cv" width="1080" height="1920" aria-label="Your story preview"></canvas>

  <div>
    <button id="share" type="button">Share to Instagram</button>
    <p class="status" id="status" role="status"></p>
    <img class="out" id="out" alt="Your finished story" hidden>
  </div>
</div>

const sample=[[0,0],[.12,-.35],[.3,-.2],[.42,-.55],[.66,-.75],[.86,-.6],[.95,-.25],[.8,.05],[.5,.12],[.2,.08],[0,0]];

function parseTime(s){const p=s.trim().split(':').map(Number);if(p.some(isNaN)||!p.length)return null;return p.reduce((a,v)=>a*60+v,0)}
function fmtTime(t){t=Math.round(t);const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`}
function data(){
  const d=parseFloat($('dist').value.replace(',','.'))||0,t=parseTime($('time').value)||0,pace=d>0&&t>0?t/d:0;
  let pm=Math.floor(pace/60),ps=Math.round(pace%60);if(ps===60){pm++;ps=0}
  return{dist:d.toFixed(2),time:fmtTime(t),pace:pace?`${pm}:${String(ps).padStart(2,'0')}`:'–',num:String($('num').value||1).padStart(2,'0')};
}
const val=n=>document.querySelector(`input[name=${n}]:checked`).value;

function cover(img){
  const r=Math.max(W/img.naturalWidth,H/img.naturalHeight),w=img.naturalWidth*r,h=img.naturalHeight*r;
  ctx.drawImage(img,(W-w)/2,(H-h)/2,w,h);
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(0,0,0,.28)');g.addColorStop(.3,'rgba(0,0,0,0)');g.addColorStop(.6,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.42)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
function scriptLogo(x,y,size,c,align='center'){
  ctx.font=`${size}px Yellowtail`;ctx.textAlign=align;ctx.textBaseline='alphabetic';ctx.fillStyle=c;ctx.fillText('Flatto',x,y);
  const w=ctx.measureText('Flatto').width,x0=align==='center'?x-w/2:align==='left'?x:x-w;
  ctx.save();ctx.strokeStyle=c;ctx.lineCap='round';ctx.lineWidth=size*.07;ctx.beginPath();
  ctx.moveTo(x0+w*.04,y+size*.2);ctx.quadraticCurveTo(x0+w*.55,y+size*.06,x0+w*1.02,y+size*.1);ctx.stroke();ctx.restore();
}
function text(s,x,y,font,c,align='center',ls=0){ctx.font=font;ctx.fillStyle=c;ctx.textAlign=align;ctx.letterSpacing=ls+'px';ctx.fillText(s,x,y);ctx.letterSpacing='0px'}
function drawRoute(x,y,w,h,c,lw){
  const pts=route||sample,xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  const minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys);
  const s=Math.min(w/((maxx-minx)||1),h/((maxy-miny)||1)),ox=x+(w-(maxx-minx)*s)/2,oy=y+(h-(maxy-miny)*s)/2;
  ctx.save();ctx.strokeStyle=c;ctx.lineWidth=lw;ctx.lineJoin='round';ctx.lineCap='round';ctx.beginPath();
  pts.forEach((p,i)=>{const px=ox+(p[0]-minx)*s,py=oy+(p[1]-miny)*s;i?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.stroke();
  ctx.fillStyle=c;ctx.beginPath();ctx.arc(ox+(pts[0][0]-minx)*s,oy+(pts[0][1]-miny)*s,lw*1.3,0,7);ctx.fill();ctx.restore();
}

function draw(){
  const d=data(),c=val('color'),st=val('style');
  ctx.clearRect(0,0,W,H);
  if(photo.complete&&photo.naturalWidth)cover(photo);
  ctx.shadowColor=c==='#4C2F31'?'rgba(255,255,255,.25)':'rgba(0,0,0,.35)';ctx.shadowBlur=18;
  if(st==='classic'){
    let y=520;
    [['DISTANCE',d.dist+' km'],['PACE',d.pace+' /km'],['TIME',d.time]].forEach(([l,v])=>{text(l,W/2,y,'600 34px Inter',c,'center',6);text(v,W/2,y+100,'800 96px Inter',c);y+=210});
    drawRoute(W/2-230,y-30,460,300,c,14);
    scriptLogo(W/2,y+440,150,c);text(HANDLE,W/2,y+540,'800 36px Inter',c,'center',3);
  }else if(st==='big'){
    scriptLogo(80,260,140,c,'left');text(HANDLE,86,340,'800 34px Inter',c,'left',3);
    drawRoute(W-380,140,300,220,c,16);
    ctx.font='400 420px Anton';const bw=ctx.measureText(d.dist).width;
    text(d.dist,76,1560,'400 420px Anton',c,'left');text('KM',76+bw+20,1560,'400 120px Anton',c,'left');
    ctx.fillStyle=c;ctx.fillRect(80,1620,W-160,6);
    text(d.pace+' /KM',80,1710,'800 48px Inter',c,'left',2);text(d.time,W/2,1710,'800 48px Inter',c,'center',2);text('RUN #'+d.num,W-80,1710,'800 48px Inter',c,'right',2);
  }else if(st==='bib'){
    const x=110,y=820,w=W-220,h=900,t=new Date(),ds=[t.getDate(),t.getMonth()+1].map(n=>String(n).padStart(2,'0')).join('.')+'.'+String(t.getFullYear()).slice(2);
    ctx.save();ctx.strokeStyle=c;ctx.lineWidth=8;ctx.beginPath();ctx.roundRect(x,y,w,h,48);ctx.stroke();ctx.restore();
    text('SESEH · BALI',x+60,y+90,'800 34px Inter',c,'left',5);text(ds,x+w-60,y+90,'800 34px Inter',c,'right',5);
    ctx.save();ctx.strokeStyle=c;ctx.lineWidth=7;ctx.lineJoin='round';ctx.textAlign='center';
    ctx.font='400 300px "Archivo Black"';ctx.strokeText(d.num,W/2,y+390);ctx.lineWidth=4;ctx.font='400 96px "Archivo Black"';ctx.strokeText('RUN CLUB',W/2,y+510);ctx.restore();
    ctx.save();ctx.strokeStyle=c;ctx.lineWidth=5;ctx.setLineDash([18,14]);ctx.beginPath();ctx.moveTo(x+50,y+580);ctx.lineTo(x+w-50,y+580);ctx.stroke();ctx.restore();
    [['KM',d.dist],['PACE',d.pace],['TIME',d.time]].forEach(([l,v],i)=>{const cx=x+w*(i*2+1)/6;text(l,cx,y+650,'600 30px Inter',c,'center',5);text(v,cx,y+730,'800 68px Inter',c)});
    scriptLogo(W/2,y+h-50,110,c);text(HANDLE,W/2,y+h+80,'800 34px Inter',c,'center',3);
  }else{
    drawRoute(120,560,W-240,620,c,12);
    text(`${d.dist} KM  ·  ${d.pace} /KM  ·  ${d.time}`,W/2,1290,'800 44px Inter',c,'center',3);
    scriptLogo(W/2,1460,140,c);text(HANDLE,W/2,1555,'800 34px Inter',c,'center',3);
  }
  ctx.shadowColor='transparent';ctx.shadowBlur=0;
}

function parseGPX(xml){
  const doc=new DOMParser().parseFromString(xml,'application/xml');
  const pts=[...doc.getElementsByTagName('trkpt')].map(p=>({lat:+p.getAttribute('lat'),lon:+p.getAttribute('lon'),t:p.getElementsByTagName('time')[0]?.textContent}));
  if(pts.length<2)throw new Error('no points');
  const rad=Math.PI/180;let dist=0;
  for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],dl=(b.lat-a.lat)*rad,dn=(b.lon-a.lon)*rad,h=Math.sin(dl/2)**2+Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin(dn/2)**2;dist+=2*6371*Math.asin(Math.sqrt(h))}
  const k=Math.cos(pts[0].lat*rad);route=pts.map(p=>[p.lon*k,-p.lat]);
  $('dist').value=dist.toFixed(2);
  const t0=Date.parse(pts[0].t),t1=Date.parse(pts[pts.length-1].t);if(t0&&t1&&t1>t0)$('time').value=fmtTime((t1-t0)/1000);
  return pts.length;
}

const say=m=>$('status').textContent=m;
$('share').addEventListener('click',()=>{
  draw();
  cv.toBlob(async b=>{
    const file=new File([b],'flatto-run.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file]});say('Pick Instagram, then Story.')}
      catch(e){if(e.name!=='AbortError')say("Sharing didn't open. Press and hold the story below to save it.")}
    }else{
      const out=$('out');out.src=URL.createObjectURL(b);out.hidden=false;
      say('Press and hold the story below, then Save to Photos and post it from Instagram.');
    }
  },'image/png');
});
$('photo').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const img=new Image();img.onload=()=>{photo=img;$('photoinfo').textContent='Your photo is in. Swap it anytime.';draw()};img.src=URL.createObjectURL(f)});
$('gpx').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const n=parseGPX(await f.text());$('gpxinfo').textContent=`Route loaded from ${f.name} (${n} points).`;draw()}catch(err){$('gpxinfo').textContent='That file has no track points. Export the run as GPX and try again.'}});
